<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Ghost14</title>
<meta name="description" content="You found Ghost14. Leave a message.">
<meta property="og:title" content="Ghost14">
<meta property="og:description" content="Leave me a message.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 3' shape-rendering='crispEdges'%3E%3Crect width='3' height='3' fill='%23000'/%3E%3Cpath fill='%239fe0a8' d='M1 0h1v1H1zM2 1h1v1H2zM0 2h3v1H0z'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #000;
    --panel: rgba(4, 5, 4, .78);
    --line: rgba(236, 232, 223, .12);
    --text: #ece8df;
    --muted: #9b968c;
    --dim: #5f5b54;
    --spore: #9fe0a8;
    --warn: #f0a39a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "JetBrains Mono",
            "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", "Noto Sans", system-ui, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    color: var(--text);
    font: 14px/1.6 var(--mono);
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── background ── */
  #life {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none;
    opacity: 0; transition: opacity .3s ease;
  }
  #life.on { opacity: 1; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(75% 60% at 50% 48%, rgba(0,0,0,.9), rgba(0,0,0,.45) 65%, rgba(0,0,0,.12));
  }

  /* ── layout ── */
  .stage {
    position: relative; z-index: 1;
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px;
    padding: max(60px, env(safe-area-inset-top)) 16px 24px;
    pointer-events: none;
  }
  .stage > * { pointer-events: auto; }
  .later { display: none !important; }
  .ghosted { opacity: 0; pointer-events: none; }

  /* ── name ── */
  .name {
    display: flex; align-items: center; gap: .28em;
    font-weight: 800;
    font-size: clamp(46px, 15vw, 76px);
    line-height: 1;
    letter-spacing: -.04em;
    white-space: nowrap;
    will-change: transform;
  }
  .name .tri { color: var(--spore); font-size: .5em; letter-spacing: 0; }
  .name .typed { display: inline-flex; align-items: flex-start; }
  .tag {
    font: 500 .22em/1 var(--mono);
    letter-spacing: .05em;
    color: var(--spore);
    border: 1px solid rgba(159,224,168,.4);
    padding: .35em .45em;
    margin: .12em 0 0 .3em;
    animation: snap .5s ease-out;
  }
  @keyframes snap {
    0% { box-shadow: 0 0 0 0 rgba(159,224,168,.6); background: rgba(159,224,168,.25); }
    100% { box-shadow: 0 0 0 10px rgba(159,224,168,0); background: transparent; }
  }

  .cursor {
    display: inline-block; width: .55em; height: 1em;
    background: var(--spore); margin-left: .12em;
    animation: blink 1s steps(1) infinite;
  }
  .name .cursor { height: .82em; width: .45em; }

  /* ── prompt line ── */
  .ask {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; color: var(--muted); min-height: 1.6em;
  }
  .ask .tri { color: var(--spore); font-size: 11px; }

  /* ── message box ── */
  .stage { text-shadow: 0 0 2px #000, 0 0 8px #000, 0 0 16px #000; }   /* text lifts off the Life grid */
  .box {
    width: 100%; max-width: 440px;
    transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1);
  }
  .box.ghosted { transform: translateY(14px); }
  .comment { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .comment { display: flex; justify-content: space-between; gap: 12px; }
  .prog { color: var(--dim); font-size: 12px; flex: none; font-variant-numeric: tabular-nums; }
  .steps { position: relative; }
  .step.leaving { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; animation: stepOut .28s ease forwards; }
  .step.entering { animation: stepIn .34s cubic-bezier(.2,.8,.2,1); }
  .step.leaving.rev { animation-name: stepOutRev; }
  .step.entering.rev { animation-name: stepInRev; }
  @keyframes stepOut    { to   { opacity: 0; transform: translateY(-16px); } }
  @keyframes stepIn     { from { opacity: 0; transform: translateY(14px); } }
  @keyframes stepOutRev { to   { opacity: 0; transform: translateY(16px); } }
  @keyframes stepInRev  { from { opacity: 0; transform: translateY(-14px); } }
  .q { color: var(--muted); font-size: 14px; min-height: 1.6em; }
  .q .tri { color: var(--spore); font-size: 10px; margin-right: 2px; }
  .past {
    display: none !important; max-width: 100%;
    background: none; border: 0; padding: 3px 0 0; cursor: pointer;
    font: 15px/1.5 var(--mono); color: var(--text); text-align: start;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    -webkit-tap-highlight-color: transparent;
  }
  .past::before { content: "> "; color: var(--dim); }
  .past:hover, .past:focus-visible { color: var(--spore); outline: none; }
  .entry { position: relative; display: flex; gap: 1ch; align-items: flex-start; margin-top: 2px; font-size: 16px; line-height: 1.5; }
  .entry .p { color: var(--spore); flex: none; }
  .entry .cur { position: absolute; left: 2ch; top: .2em; height: 1.1em; width: .6em; background: var(--spore); display: none; pointer-events: none; animation: blink 1s steps(1) infinite; }
  .entry.idle .cur { display: block; }
  .go {
    flex: none; width: 40px; height: 32px; margin-top: -4px;
    background: none; border: 0; padding: 0; cursor: pointer;
    color: var(--dim); font: 18px var(--mono);
    -webkit-tap-highlight-color: transparent;
  }
  .go:hover, .go:focus-visible { color: var(--spore); outline: none; }
  .go:active { transform: scale(.9); }
  .cnt { color: var(--dim); font-size: 11px; }
  .under { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; min-height: 36px; }
  .back { color: var(--muted); }
  .back .label { color: var(--muted); }
  .btn.small { font-size: 13px; padding: 8px 2px; }
  textarea, input[type=text] {
    flex: 1; min-width: 0;
    background: transparent; border: 0; border-radius: 0; padding: 0; margin: 0;
    color: var(--text); caret-color: var(--spore);
    font: 16px/1.5 var(--mono); /* 16px stops iOS zoom */
    text-shadow: inherit;
    -webkit-appearance: none; appearance: none;
  }
  textarea { min-height: 1.5em; resize: none; overflow: hidden; display: block; }
  ::placeholder { color: transparent; }
  textarea:focus, input:focus { outline: none; }
  .bad { color: var(--warn) !important; caret-color: var(--warn); }

  .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; }
  .count { color: var(--dim); font-size: 12px; }
  .btn {
    background: none; border: 0; padding: 6px 0; cursor: pointer;
    font: 500 14px var(--mono); color: var(--spore);
    -webkit-tap-highlight-color: transparent;
  }
  .btn .k { color: var(--dim); }
  .btn:hover .label, .btn:focus-visible .label { background: var(--spore); color: #000; }
  .btn:focus { outline: none; }
  .btn:disabled { opacity: .5; cursor: wait; }
  .hp { position: absolute; left: -9999px; }
  .err { color: var(--warn); font-size: 12px; margin-top: 8px; }
  .done { padding: 12px 2px 4px; }
  .done .ok { color: var(--spore); }
  .done .btn { margin-top: 14px; }
  .wait { color: var(--dim); font-size: 12px; margin-top: 10px; }
  .wait b { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }

  /* ── corners ── */
  .corner { position: fixed; z-index: 2; transition: opacity 1s ease; }
  .top { top: max(14px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 8px; }
  .top.left { left: 14px; }
  .top.right { right: 14px; }
  .corner.top { text-shadow: 0 0 2px #000, 0 0 10px #000, 0 0 18px #000; }
  .gh {
    display: inline-block; padding: 8px 4px;
    font: 500 14px var(--mono); color: var(--spore); text-decoration: none; letter-spacing: .02em;
    text-shadow: 0 0 2px #000, 0 0 10px #000, 0 0 8px rgba(159,224,168,.45);
    transition: text-shadow .2s, color .2s;
  }
  .gh .arr { color: var(--muted); font-size: 12px; }
  .gh:hover, .gh:focus-visible { color: #c6f5cd; outline: none; text-shadow: 0 0 2px #000, 0 0 14px rgba(159,224,168,.8); }
  .lang { position: relative; display: flex; align-items: center; }
  .lang select {
    appearance: none; -webkit-appearance: none;
    background: transparent; border: 0; border-radius: 0;
    color: var(--text); font: 14px var(--mono);
    padding: 8px 18px 8px 4px; cursor: pointer;
    text-shadow: 0 0 2px #000, 0 0 10px #000, 0 0 16px #000;
  }
  .lang::after { content: "▾"; position: absolute; right: 2px; pointer-events: none; font-size: 11px; color: var(--spore); }
  .lang select:focus-visible { outline: 1px dashed rgba(159,224,168,.5); outline-offset: 2px; }
  .lang select:hover { color: #fff; }
  .lang option { background: #000; color: var(--text); }
  .snd {
    display: grid; place-items: center;
    width: 44px; height: 40px; padding: 0;
    background: none; border: 0; border-radius: 0;
    color: var(--muted); cursor: pointer;
    filter: drop-shadow(0 0 2px #000) drop-shadow(0 0 8px #000);
    -webkit-tap-highlight-color: transparent;
    transition: color .2s, filter .2s;
  }
  .snd:hover, .snd:focus-visible { color: var(--text); outline: none; }
  .snd[aria-pressed="true"] { color: var(--spore); filter: drop-shadow(0 0 2px #000) drop-shadow(0 0 7px rgba(159,224,168,.55)); }
  .snd .w { transition: opacity .2s; }
  .snd[aria-pressed="false"] .w { opacity: 0; }
  .snd[aria-pressed="true"] .x { opacity: 0; }
  /* ── town ── */
  .town {
    position: relative; z-index: 1; flex: none;
    height: calc(150px + env(safe-area-inset-bottom));
    transition: opacity 1.4s ease;
  }
  .town canvas {
    position: absolute; left: 0; top: 18px;
    width: 100%; height: 132px;
    image-rendering: pixelated; image-rendering: crisp-edges;
    display: block; cursor: pointer;
  }
  .town::after {                       /* ground continues under the phone's home bar */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0;
    height: env(safe-area-inset-bottom); background: #0a0d0b;
  }
  .hint {
    position: absolute; top: 0; left: 0; right: 0;
    text-align: center; font-size: 11px; color: var(--dim); pointer-events: none;
  }
  .bubble {
    position: absolute; z-index: 2;
    transform: translate(-50%, -100%);
    background: rgba(0,0,0,.88);
    border: 1px solid rgba(159,224,168,.45);
    color: var(--text); font-size: 11px; line-height: 1.4;
    padding: 3px 8px; white-space: nowrap; pointer-events: none;
  }
  .bubble .d { color: var(--dim); }

  /* ── character creator (sized for thumbs) ── */
  .creator {
    display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; align-items: center;
    margin-top: 10px; padding: 0 0 0 2ch;
  }
  #preview { width: 72px; height: 96px; image-rendering: pixelated; image-rendering: crisp-edges; }
  .picks { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .pick { display: flex; align-items: center; gap: 6px; }
  .pick .pl { flex: 1; text-align: center; white-space: nowrap; font-size: 13px; color: var(--muted); }
  .arw, .dice {
    background: none; border: 0; border-radius: 0;
    color: var(--spore); cursor: pointer; padding: 0; flex: none;
    text-shadow: 0 0 2px #000, 0 0 8px rgba(159,224,168,.4);
    -webkit-tap-highlight-color: transparent;
  }
  .arw { width: 44px; height: 40px; font-size: 15px; }
  .dice { width: 44px; height: 40px; font-size: 26px; line-height: 1; }
  .arw:hover, .dice:hover, .arw:focus-visible, .dice:focus-visible { color: #c6f5cd; outline: none; }
  .arw:active, .dice:active { transform: scale(.94); }
  .tones { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .skins { display: flex; flex-wrap: wrap; gap: 7px; }
  .sk { width: 26px; height: 26px; border: 0; border-radius: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .sk[aria-pressed="true"] { box-shadow: 0 0 0 2px #000, 0 0 0 3px var(--spore); }
  .sk:focus-visible { outline: 1px solid var(--spore); outline-offset: 3px; }

  /* ── the spore: one living cell waiting to be touched ── */
  .spore {
    position: fixed; left: 50%; top: 50%; z-index: 3;
    width: 44px; height: 44px; margin: -22px 0 0 -22px;   /* generous tap area */
    display: grid; place-items: center;
    background: none; border: 0; padding: 0; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .spore::before {
    content: ""; width: 9px; height: 9px;
    background: var(--spore);
    box-shadow: 0 0 10px rgba(159,224,168,.7), 0 0 26px rgba(159,224,168,.35);
    animation: heartbeat 1.6s ease-in-out infinite;
  }
  .spore:focus-visible { outline: 1px solid rgba(159,224,168,.5); outline-offset: 4px; }
  .spore.burst { pointer-events: none; }
  .spore.burst::before { animation: pop .45s ease-out forwards; }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); opacity: .85; }
    14% { transform: scale(1.35); opacity: 1; }
    28% { transform: scale(1); opacity: .85; }
    42% { transform: scale(1.22); opacity: 1; }
    60% { transform: scale(1); opacity: .8; }
  }
  @keyframes pop {
    0% { transform: scale(1.4); opacity: 1; }
    100% { transform: scale(5); opacity: 0; box-shadow: 0 0 40px rgba(159,224,168,0); }
  }
  @keyframes blink { 50% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="life" aria-hidden="true"></canvas>
<div class="vignette"></div>

<div class="corner top left ghosted" id="topLeft">
  <a class="gh" id="gh" href="#" target="_blank" rel="noopener me" hidden>.github<span class="arr"> ↗</span></a>
</div>
<div class="corner top right ghosted" id="topRight">
  <button type="button" class="snd" id="snd" aria-label="Sound" aria-pressed="false">
    <svg width="26" height="23" viewBox="0 0 15 13" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
      <path d="M1 4.5h2.5L7 1.5v10L3.5 8.5H1z" fill="currentColor" stroke="none"/>
      <path class="w" d="M9.5 4.2a3 3 0 0 1 0 4.6M11.5 2.4a5.6 5.6 0 0 1 0 8.2"/>
      <path class="x" d="M9.5 4.5l4 4M13.5 4.5l-4 4"/>
    </svg>
  </button>
  <label class="lang"><select id="lang" aria-label="Language"></select></label>
</div>

<button type="button" class="spore" id="spore" aria-label="Ghost14"></button>

<main class="stage">
  <h1 class="name ghosted" id="nameLine" aria-label="Ghost14">
    <span class="tri" aria-hidden="true">▸</span>
    <span class="typed" id="typed" aria-hidden="true"></span>
  </h1>

  <p class="ask later" id="askLine">
    <span class="tri" aria-hidden="true">▸</span>
    <span id="askText" dir="auto">&nbsp;</span>
  </p>

  <section class="box later" id="box">
    <form id="msg-form" novalidate autocomplete="off">
      <p class="comment"><span dir="auto"># <span data-i18n="hint"></span></span><span class="prog" id="prog"></span></p>

      <div class="steps" id="steps">
      <div class="step" id="st-name" hidden>
        <p class="q" dir="auto"><span class="tri">▸</span> <span class="qt"></span></p>
        <button type="button" class="past" dir="auto"></button>
        <div class="entry">
          <span class="p">&gt;</span>
          <span class="cur" aria-hidden="true"></span>
          <input type="text" id="sender" name="sender" maxlength="60" dir="auto" data-i18n-ph="name_ph" autocomplete="nickname" enterkeyhint="next">
          <button type="button" class="go" aria-label="Next">↵</button>
        </div>
      </div>

      <div class="step" id="st-msg" hidden>
        <p class="q" dir="auto"><span class="tri">▸</span> <span class="qt"></span></p>
        <button type="button" class="past" dir="auto"></button>
        <div class="entry">
          <span class="p">&gt;</span>
          <span class="cur" aria-hidden="true"></span>
          <textarea id="message" name="message" rows="1" maxlength="1000" dir="auto" data-i18n-ph="msg_ph" enterkeyhint="next"></textarea>
          <button type="button" class="go" aria-label="Next">↵</button>
        </div>
        <div class="under"><button type="button" class="btn small back"><span class="k">[</span> ‹ <span class="label" data-i18n="back"></span> <span class="k">]</span></button><span class="cnt"><span id="count">0/1000</span></span></div>
      </div>

      <div class="step" id="st-contact" hidden>
        <p class="q" dir="auto"><span class="tri">▸</span> <span class="qt"></span></p>
        <button type="button" class="past" dir="auto"></button>
        <div class="entry">
          <span class="p">&gt;</span>
          <span class="cur" aria-hidden="true"></span>
          <input type="text" id="contact" name="contact" maxlength="120" dir="auto" data-i18n-ph="contact_ph" autocomplete="off" enterkeyhint="next">
          <button type="button" class="go" aria-label="Next">↵</button>
        </div>
        <div class="under"><button type="button" class="btn small back"><span class="k">[</span> ‹ <span class="label" data-i18n="back"></span> <span class="k">]</span></button><button type="button" class="btn small" id="skip"><span class="k">[</span> <span class="label" data-i18n="skip"></span> <span class="k">]</span></button></div>
      </div>

      <div class="step" id="st-look" hidden>
        <p class="q" dir="auto"><span class="tri">▸</span> <span class="qt"></span></p>
        <div class="creator">
          <canvas id="preview" width="12" height="16" aria-hidden="true"></canvas>
          <div class="picks">
            <div class="pick">
              <button type="button" class="arw" data-k="0" data-d="-1" aria-label="Previous head">◀</button>
              <span class="pl" id="lblHead">head</span>
              <button type="button" class="arw" data-k="0" data-d="1" aria-label="Next head">▶</button>
            </div>
            <div class="pick">
              <button type="button" class="arw" data-k="1" data-d="-1" aria-label="Previous outfit">◀</button>
              <span class="pl" id="lblFit">outfit</span>
              <button type="button" class="arw" data-k="1" data-d="1" aria-label="Next outfit">▶</button>
            </div>
          </div>
          <div class="tones">
            <div class="skins" id="skins" role="group" aria-label="Skin"></div>
            <button type="button" class="dice" id="dice" aria-label="Random look">⚄</button>
          </div>
        </div>
        <div class="actions">
          <button type="button" class="btn small back"><span class="k">[</span> ‹ <span class="label" data-i18n="back"></span> <span class="k">]</span></button>
          <button type="submit" class="btn" id="send"><span class="k">[</span> <span class="label" id="sendLabel" data-i18n="send"></span> ↵ <span class="k">]</span></button>
        </div>
      </div>

      </div>

      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">
      <p class="err" id="err" dir="auto" hidden></p>
    </form>
    <div class="done" id="done" hidden>
      <p class="ok" dir="auto" data-i18n="sent"></p>
      <button type="button" class="btn" id="again"><span class="k">[</span> <span class="label" data-i18n="again"></span> <span class="k">]</span></button>
    </div>
    <p class="wait" id="wait" dir="auto" aria-live="polite" hidden></p>
  </section>
</main>

<div class="town later" id="town">
  <p class="hint" dir="auto">// <span data-i18n="tap"></span></p>
  <canvas id="townCanvas" aria-label="Visitors' town"></canvas>
  <div class="bubble" id="bubble" hidden></div>
</div>

<script>
  // ▼ Your Google Sheet web app (Apps Script) — messages, daily cap and on/off switch live there
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyWpwYvYT5Y_nehO63GXxm2IbDP0RFp7xaIKHAg6KKnHCBJzg93l4_iXvU7pATsX_aN/exec";
  // ▼ Your GitHub username. Leave blank to detect it from the yourname.github.io address.
  const GITHUB_USER = "";
  // ▼ Spam limits per visitor: minutes between messages, and max messages per 24 hours
  const COOLDOWN_MIN = 10;
  const MAX_PER_DAY = 5;

  /* ───────── Translations ───────── */
  const I18N = {
    en: { back: "back", q_name: "what's your name?", q_msg: "hi {name}. what's on your mind?", q_contact: "how can I reach you? (optional)", q_look: "last thing: pick your look", skip: "skip",
      badname: "That name isn't allowed. Try another.", full: 'My inbox is full for today. Come back tomorrow.', closed: 'Not taking messages right now. Check back later.',
      cooldown: 'You can send another in {t}.', daily: "That's plenty for today. Come back tomorrow.",
      _name: "English", leave: "leave me a message",
      hint: "only I can read what you write here", msg_ph: "type your message…",
      name_ph: "your name", contact_ph: "contact (optional)",
      send: "send", sending: "transmitting…", sent: "✓ Message delivered. Thanks, I'll read it soon.", again: "write another",

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  function detectLang() {
    const s = store.get("g14-lang"); if (s && I18N[s]) return s;
    const prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
    for (const raw of prefs) {
      const tag = raw.toLowerCase();
      if (tag.startsWith("zh")) return /hant|-tw|-hk|-mo/.test(tag) ? "zh-Hant" : "zh-Hans";
      const base = tag.split("-")[0];
      if (I18N[base]) return base;
    }

      { name: "dive", pal: { O: "#2a4a8f", D: "#17305f", A: "#79b8e8", B: "#e6f0fa", L: "#1b2a4a" }, rows: ["..DOOOOOOD..", "..OOOOOOOO..", "..OBAAAAOO..", "..SOOOOOOS..", "...OOOOOO...", "...LL..LL...", "...BB..BB..."] }, // deep-sea techsuit
      { name: "hoodie", pal: { O: "#e8c07a", D: "#c49a55", A: "#f6e7c6", B: "#8a5a2b", L: "#8a6a45" }, rows: ["..DOOOOOOD..", "..OAOOOOAO..", "..OABBBBAO..", "..SOOOOOOS..", "...OOOOOO...", "...LL..LL...", "...BB..BB..."] }, // cream hoodie
      { name: "gown", pal: { O: "#232c52", D: "#141a33", A: "#e8c55a", B: "#cfd8ea" }, rows: ["..OOOAAOOO..", "..OOOOOOOO..", "..OOAOOAOO..", "..SOOOOOOS..", "...OOOOOO...", "...OOOOOO...", "...DAAAAD..."] }, // long midnight gown
      { name: "robe", pal: { O: "#6b4fa8", D: "#4a3178", A: "#e8e4f5", B: "#b9a8e6" }, rows: ["..DOOOOOOD..", "..OAOOOOAO..", "..OABBBAOO..", "..SOOOOOOS..", "...OOOOOO...", "...OOOOOO...", "...DBBBBD..."] } // violet cloud robe
    ];

    const parse = (code) => {
      const p = String(code || "").split("-").map(n => parseInt(n, 10));
      if (p.length !== 3 || p.some(n => isNaN(n) || n < 0)) return null;
      return [p[0] % HEADS.length, p[1] % OUTFITS.length, p[2] % SKINS.length];
    };
    function paint(g, lines, y0, pal, skin) {
      for (const [ry, line] of lines) {
        for (let x = 0; x < 12; x++) {
          const c = line[x];
          if (!c || c === ".") continue;
          g.fillStyle = c === "S" ? skin : c === "E" ? EYE : pal[c];
          g.fillRect(x, y0 + ry, 1, 1);
        }
      }
    }
    const cache = new Map();
    function frames(code) {
      const p = parse(code);
      if (!p) return null;
      const key = p.join("-");
      if (cache.has(key)) return cache.get(key);
      const [h, o, s] = p, skin = SKINS[s], head = HEADS[h], fit = OUTFITS[o];
      const make = (walk) => {
        const c = document.createElement("canvas"); c.width = 12; c.height = 16;
        const g = c.getContext("2d");
        paint(g, BASE.map((l, i) => [i, l]), 0, {}, skin);
        paint(g, fit.rows.map((l, i) => [i, l]), 9, fit.pal, skin);
        paint(g, Object.entries(head.rows).map(([k, v]) => [+k, v]), 0, head.pal, skin);
        if (walk) {                                   // step: boots spread apart
          const line = fit.rows[6];
          if (line.includes("B")) {
            g.clearRect(0, 15, 12, 1);
            for (let x = 0; x < 12; x++) {
              const ch = line[x]; if (ch === ".") continue;
              g.fillStyle = fit.pal[ch];
              g.fillRect(ch === "B" ? (x < 6 ? x - 1 : x + 1) : x, 15, 1, 1);
            }
          }
        }
        return c;
      };
      const f = [make(false), make(true)];
      cache.set(key, f);
      return f;
    }
    const nameOf = (list) => (i) => (list[i] && list[i].name) || "";
    return { SKINS, nH: HEADS.length, nO: OUTFITS.length, headName: nameOf(HEADS), outfitName: nameOf(OUTFITS), frames, parse };
  })();

  /* ───────── The town: buildings, bonfire and visitors ───────── */
  const Town = (() => {
    const wrap = document.getElementById("town");
    const cv = document.getElementById("townCanvas");
    const g = cv.getContext("2d");
    const bubble = document.getElementById("bubble");
    const HU = 44, GROUND = 34, CANVAS_TOP = 18;   // height in pixel units; buildings stand on GROUND
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let W = 0, cx = 0, unit = 3, statics = null;
    let visitors = [], people = [], sparks = [], flames = [0, 0, 0, 0, 0, 0, 0];
    let running = false, last = 0, flameT = 0, focus = null, focusUntil = 0, built = false;

    const seeded = (seed) => () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

    function building(b, type, x, r) {
      const wall = "#131819", roof = "#1d2627", door = "#070909", warm = "#f0c96a", dark = "#1f2829";
      const lit = () => (r() < 0.78 ? warm : dark);
      if (type === "house") {
        const w = 11 + Math.floor(r() * 6), h = 8 + Math.floor(r() * 4), top = GROUND - h;
        b.fillStyle = wall; b.fillRect(x, top, w, h);
        b.fillStyle = roof;
        for (let i = 0; w + 2 - 2 * i > 0; i++) b.fillRect(x - 1 + i, top - 1 - i, w + 2 - 2 * i, 1);
        b.fillStyle = door; b.fillRect(x + (w >> 1) - 1, GROUND - 3, 2, 3);
        b.fillStyle = lit(); b.fillRect(x + 2, top + 2, 2, 2);
        b.fillStyle = lit(); b.fillRect(x + w - 4, top + 2, 2, 2);
        return w;
      }
      if (type === "tower") {
        const w = 7 + Math.floor(r() * 3), h = 17 + Math.floor(r() * 6), top = GROUND - h;
        b.fillStyle = wall; b.fillRect(x, top, w, h);
        b.fillStyle = roof;
        for (let i = 0; w + 2 - 2 * Math.floor(i / 2) > 0; i++) {
          const ww = w + 2 - 2 * Math.floor(i / 2);
          b.fillRect(x - 1 + Math.floor(i / 2), top - 1 - i, ww, 1);
        }
        b.fillStyle = lit(); b.fillRect(x + (w >> 1), top + 3, 1, 2);
        b.fillStyle = lit(); b.fillRect(x + (w >> 1), top + 9, 1, 2);
        b.fillStyle = door; b.fillRect(x + (w >> 1) - 1, GROUND - 3, 2, 3);
        return w;
      }
      // tavern
      const w = 20 + Math.floor(r() * 5), h = 11, top = GROUND - h;
      b.fillStyle = wall; b.fillRect(x, top, w, h);
      b.fillStyle = roof;
      for (let i = 0; i < 4; i++) b.fillRect(x - 1 + i * 2, top - 1 - i, w + 2 - i * 4, 1);
      b.fillStyle = warm; b.fillRect(x + 3, top + 3, 3, 2); b.fillRect(x + w - 6, top + 3, 3, 2);
      b.fillStyle = door; b.fillRect(x + (w >> 1) - 1, GROUND - 4, 3, 4);
      b.fillStyle = "#3a3226"; b.fillRect(x + w, top + 2, 3, 1);
      b.fillStyle = "#c9a14a"; b.fillRect(x + w + 1, top + 3, 2, 2);
      return w;
    }

    function layout() {
      const cssW = wrap.clientWidth || innerWidth;
      W = Math.max(60, Math.ceil(cssW / 3));
      unit = cssW / W;
      cx = W >> 1;
      cv.width = W; cv.height = HU;
      statics = document.createElement("canvas");
      statics.width = W; statics.height = HU;
      const b = statics.getContext("2d"), r = seeded(W * 31 + 14);
      const fade = b.createLinearGradient(0, 0, 0, GROUND);
      fade.addColorStop(0, "rgba(0,0,0,0)"); fade.addColorStop(1, "rgba(0,0,0,.92)");
      b.fillStyle = fade; b.fillRect(0, 0, W, GROUND);
      const fill = (from, to) => {
        let x = from + Math.floor(r() * 4);
        while (x < to) {
          const roll = r(), type = roll < 0.5 ? "house" : roll < 0.75 ? "tower" : "tavern";
          const need = type === "house" ? 18 : type === "tower" ? 10 : 28;
          if (x + need > to) break;
          x += building(b, type, x, r) + 3 + Math.floor(r() * 6);
        }
      };
      fill(1, cx - 13);
      fill(cx + 13, W - 1);
      b.fillStyle = "#0a0d0b"; b.fillRect(0, GROUND, W, HU - GROUND);
      b.fillStyle = "#1f2d22"; b.fillRect(0, GROUND, W, 1);
      for (let i = 0; i < W / 3; i++) {
        b.fillStyle = r() < 0.5 ? "#203227" : "#141d17";
        b.fillRect(Math.floor(r() * W), GROUND + 1 + Math.floor(r() * (HU - GROUND - 1)), 1, 1);
      }
      for (const p of people) p.x = Math.min(p.x, W - 13);
    }

    function person(v, i) {
      const spread = reduced || !built;
      return {
        v, frames: Av.frames(v.a), feet: 37 + Math.floor(Math.random() * 7),
        x: spread ? 2 + ((i * 37) % Math.max(1, W - 16)) : 2 + Math.random() * (W - 16),
        dir: Math.random() < 0.5 ? -1 : 1, state: "idle", timer: Math.random() * 3, speed: 0, target: 0, ft: 0
      };
    }
    function populate() {
      if (!W) return;
      const max = Math.max(6, Math.min(40, Math.floor(W / 7)));
      const mine = people.filter(p => p.v.me);
      const rest = visitors.filter(v => Av.parse(v.a) && !mine.some(m => m.v.t === v.t && m.v.n === v.n))
                           .slice(0, max - mine.length);
      people = [...mine, ...rest.map(person)];
    }

    function think(p, dt) {
      if (p.state === "idle") {
        p.timer -= dt;
        if (p.timer > 0) return;
        if (Math.random() < 0.22) {                  // drift to the fire
          const side = Math.random() < 0.5 ? -1 : 1;
          p.target = cx + side * (9 + Math.random() * 14) - 6;
        } else {
          p.target = 1 + Math.random() * (W - 14);
        }
        p.target = Math.max(1, Math.min(W - 13, p.target));
        p.speed = 5 + Math.random() * 5;
        p.state = "walk";
        return;
      }
      const d = p.target - p.x;
      p.dir = d < 0 ? -1 : 1;
      p.x += p.dir * Math.min(Math.abs(d), p.speed * dt);
      p.ft += dt;
      if (Math.abs(p.target - p.x) < 0.3) {
        p.state = "idle";
        p.timer = 2 + Math.random() * 7;
        if (Math.abs(p.x + 6 - cx) < 20) p.dir = p.x + 6 < cx ? 1 : -1;   // face the fire
      }
    }

    function drawPerson(p) {
      const walking = p.state === "walk", step = walking && Math.floor(p.ft * 6) % 2 === 1;
      const img = p.frames[step ? 1 : 0], x = Math.round(p.x), y = p.feet - 16 - (step ? 1 : 0);
      g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(x + 3, p.feet, 6, 1);
      if (p.dir < 0) { g.save(); g.translate(x + 12, y); g.scale(-1, 1); g.drawImage(img, 0, 0); g.restore(); }
      else g.drawImage(img, x, y);
    }

    function drawFire(t) {
      const fy = 41;
      const glow = g.createRadialGradient(cx, fy - 3, 1, cx, fy - 3, 22);
      const a = 0.2 + Math.sin(t * 7) * 0.03 + Math.random() * 0.03;
      glow.addColorStop(0, `rgba(240,150,70,${a})`); glow.addColorStop(1, "rgba(240,150,70,0)");
      g.fillStyle = glow; g.fillRect(cx - 24, fy - 26, 48, 30);
      g.fillStyle = "#2a2f2c"; g.fillRect(cx - 5, fy, 1, 1); g.fillRect(cx + 5, fy, 1, 1);
      g.fillStyle = "#6b4428"; g.fillRect(cx - 4, fy, 4, 1); g.fillRect(cx + 1, fy, 4, 1);
      g.fillStyle = "#4a2e1a"; g.fillRect(cx - 3, fy - 1, 7, 1);
      flames.forEach((h, i) => {
        for (let j = 0; j < h; j++) {
          const f = j / h;
          g.fillStyle = f < 0.35 ? "#c8442f" : f < 0.7 ? "#f08a3a" : "#f5d36b";
          g.fillRect(cx - 3 + i, fy - 2 - j, 1, 1);
        }
      });
      for (const s of sparks) {
        g.fillStyle = s.c ? `rgba(159,224,168,${s.life})` : `rgba(245,211,107,${s.life})`;
        g.fillRect(Math.round(s.x), Math.round(s.y), 1, 1);
      }
    }

    function frame(ts) {
      const now = ts / 1000;
      const dt = Math.min(0.05, last ? now - last : 0); last = now;
      if (!reduced) {
        flameT -= dt;
        if (flameT <= 0) {
          flameT = 0.11;
          flames = [2, 4, 6, 7, 6, 4, 2].map(b => Math.max(1, Math.round(b * (0.6 + Math.random() * 0.55))));
          if (Math.random() < 0.35) sparks.push({ x: cx - 1 + Math.random() * 3, y: 33, vx: (Math.random() - 0.5) * 3, vy: -6 - Math.random() * 6, life: 1 });
        }
        for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt * (s.c ? 0.8 : 0.9); }
        sparks = sparks.filter(s => s.life > 0);
        for (const p of people) if (p !== focus || ts > focusUntil) think(p, dt);
      } else if (!flames[3]) flames = [2, 4, 6, 7, 6, 4, 2];

      g.clearRect(0, 0, W, HU);
      g.drawImage(statics, 0, 0);
      const order = [...people].sort((a, b) => a.feet - b.feet);
      let fireDrawn = false;
      for (const p of order) {
        if (!fireDrawn && p.feet > 41) { drawFire(now); fireDrawn = true; }
        drawPerson(p);
      }
      if (!fireDrawn) drawFire(now);

      if (focus && ts < focusUntil) {
        bubble.hidden = false;
        const half = bubble.offsetWidth / 2 + 4, cw = wrap.clientWidth;
        bubble.style.left = Math.max(half, Math.min(cw - half, (Math.round(focus.x) + 6) * unit)) + "px";
        bubble.style.top = CANVAS_TOP + (focus.feet - 17) * unit + "px";
      } else if (!bubble.hidden) { bubble.hidden = true; focus = null; }

      if (running && !reduced) requestAnimationFrame(frame);
    }

    function show(p, ms = 4000) {
      focus = p;
      focusUntil = performance.now() + ms;
      const when = new Intl.DateTimeFormat(lang, { month: "short", year: "numeric" }).format(p.v.t);
      bubble.replaceChildren(
        document.createTextNode(String(p.v.n).slice(0, 24)),
        Object.assign(document.createElement("span"), { className: "d", textContent: " · " + when })
      );
    }

    cv.addEventListener("pointerdown", (e) => {
      const r = cv.getBoundingClientRect();
      const ux = (e.clientX - r.left) / r.width * W, uy = (e.clientY - r.top) / r.height * HU;
      const hit = [...people].sort((a, b) => b.feet - a.feet)
        .find(p => ux >= p.x + 1 && ux <= p.x + 11 && uy >= p.feet - 17 && uy <= p.feet + 1);
      if (hit) { show(hit); Sound.key(); if (reduced) frame(performance.now()); }
    });
    addEventListener("resize", () => { if (built) { layout(); if (reduced) frame(performance.now()); } });

    return {
      setVisitors(list) {
        visitors = (list || []).slice().sort((a, b) => b.t - a.t);
        populate();
        if (built && reduced) frame(performance.now());
      },
      start() {
        built = true;
        layout(); populate();
        running = true;
        requestAnimationFrame(frame);
        // after a moment, introduce the most recent visitor so people learn they can tap
        setTimeout(() => { const p = people.find(q => !q.v.me) || people[0]; if (p) show(p, 3500); if (reduced) frame(performance.now()); }, 1800);
      },
      addMe(v) {
        const p = person({ ...v, me: true }, people.length);
        p.x = Math.max(1, Math.min(W - 13, cx + (Math.random() < 0.5 ? -18 : 6)));
        people.unshift(p);
        for (let i = 0; i < 14; i++) sparks.push({ x: p.x + 2 + Math.random() * 8, y: p.feet - 2 - Math.random() * 14, vx: (Math.random() - 0.5) * 4, vy: -4 - Math.random() * 6, life: 1, c: true });
        show(p, 4500);
        if (reduced) frame(performance.now());
      }
    };
  })();

  /* ───────── Intro sequence ───────── */
  const nameLine = document.getElementById("nameLine");
  const typed = document.getElementById("typed");
  const askLine = document.getElementById("askLine");
  const askText = document.getElementById("askText");
  const box = document.getElementById("box");
  const townEl = document.getElementById("town");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let skipping = reduced;
  const wait = (ms) => skipping ? Promise.resolve() : new Promise(r => setTimeout(r, ms));
  const cursor = document.createElement("span");
  cursor.className = "cursor"; cursor.setAttribute("aria-hidden", "true");

  async function typeName() {
    const word = document.createElement("span");
    typed.append(word, cursor);
    await wait(650);
    const chars = "Ghost";
    for (let i = 1; i <= chars.length; i++) {
      word.textContent = chars.slice(0, i);
      if (!skipping) Sound.key();
      await wait(110 + Math.random() * 70);
    }
    await wait(160);
    const tag = document.createElement("span");
    tag.className = "tag";
    typed.insertBefore(tag, cursor);
    tag.textContent = "1";
    if (!skipping) Sound.key();
    await wait(150);
    tag.textContent = "14";
    if (!skipping) Sound.snap();
  }

  async function moveUp() {
    const before = nameLine.getBoundingClientRect().top;
    askLine.classList.remove("later"); askLine.classList.add("ghosted");
    box.classList.remove("later"); box.classList.add("ghosted");
    townEl.classList.remove("later"); townEl.classList.add("ghosted");
    const after = nameLine.getBoundingClientRect().top;
    if (skipping) return;
    nameLine.style.transform = `translateY(${before - after}px)`;
    nameLine.getBoundingClientRect();
    nameLine.style.transition = "transform .9s cubic-bezier(.65,0,.25,1)";
    nameLine.style.transform = "";
    await wait(900);
    nameLine.style.transition = "";
  }

  async function typeAsk() {
    askLine.classList.remove("ghosted");
    askText.textContent = "";
    askText.after(cursor);
    const chars = Array.from(t("leave"));
    for (let i = 1; i <= chars.length; i++) {
      askText.textContent = chars.slice(0, i).join("");
      if (!skipping && chars[i - 1] !== " ") Sound.key(0.5);
      await wait(45 + Math.random() * 35);
    }
    askTyped = true;
  }

  function reveal() {
    box.classList.remove("ghosted");
    ["topLeft", "topRight"].forEach(id => document.getElementById(id).classList.remove("ghosted"));
    townEl.classList.remove("ghosted");
    life.start(!reduced);
    Town.start();
    setTimeout(() => Term.begin(), reduced ? 0 : 450);
  }

  async function intro() {
    const at = await waitForSpore();
    life.bloom(at.x, at.y);
    life.start(!reduced);
    setTimeout(() => Sound.bloom(), 140);    // give the browser a moment to wake the audio
    nameLine.classList.remove("ghosted");
    await typeName();
    await wait(650);
    await moveUp();
    await wait(150);
    await typeAsk();
    await wait(350);
    reveal();
  }

  // tapping during the intro jumps to the end — armed once the spore has been touched
  const skip = () => { skipping = true; };
  function armSkip() {
    addEventListener("pointerdown", skip, { once: true });
    addEventListener("keydown", skip, { once: true });
  }

  // The page waits on a single pulsing spore. Touching it is the visitor's first tap,
  // which is also what lets the browser play sound — so the whole intro has audio.
  function waitForSpore() {
    const spore = document.getElementById("spore");
    return new Promise(resolve => {
      const evs = ["pointerup", "touchend", "click", "keydown"];
      const go = () => {
        evs.forEach(ev => removeEventListener(ev, go, true));
        Sound.unlock();
        const r = spore.getBoundingClientRect();
        spore.classList.add("burst");
        setTimeout(() => spore.remove(), 500);
        setTimeout(armSkip, 60);
        resolve({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
      };
      evs.forEach(ev => addEventListener(ev, go, true));
    });
  }

  applyLang();
  intro();

  /* ───────── Message form: a terminal that asks one thing at a time ───────── */
  const form = document.getElementById("msg-form");
  const done = document.getElementById("done");
  const msg = document.getElementById("message");
  const sender = document.getElementById("sender");
  const contact = document.getElementById("contact");
  const countEl = document.getElementById("count");
  const sendBtn = document.getElementById("send");
  const sendLabel = document.getElementById("sendLabel");
  const errEl = document.getElementById("err");

  function grow() { msg.style.height = "auto"; msg.style.height = Math.max(38, msg.scrollHeight + 2) + "px"; }
  function showErr(key, field) {
    const host = field ? field.closest(".step") : document.getElementById("st-look");
    host.appendChild(errEl);
    errEl.textContent = t(key); errEl.hidden = false;
    if (field) { field.classList.add("bad"); field.focus(); }
    Sound.error();
  }
  function clearErr() { errEl.hidden = true; [msg, sender].forEach(f => f.classList.remove("bad")); }
  msg.addEventListener("input", () => { countEl.textContent = msg.value.length + "/1000"; grow(); clearErr(); });
  sender.addEventListener("input", clearErr);

  const Term = (() => {
    const steps = [
      { el: document.getElementById("st-name"),    input: sender,  key: "q_name",    need: "noname" },
      { el: document.getElementById("st-msg"),     input: msg,     key: "q_msg",     need: "empty" },
      { el: document.getElementById("st-contact"), input: contact, key: "q_contact" },
      { el: document.getElementById("st-look"),                    key: "q_look",    last: true }
    ];
    steps.forEach(st => { st.qt = st.el.querySelector(".qt"); st.past = st.el.querySelector(".past"); });

    // a blinking block sits after the ">" while a line is empty and not being typed in
    const idle = (st) => { if (st.input) st.input.closest(".entry").classList.toggle("idle", !st.input.value && document.activeElement !== st.input); };
    steps.forEach(st => {
      if (!st.input) return;
      ["input", "focus", "blur"].forEach(ev => st.input.addEventListener(ev, () => idle(st)));
      st.input.closest(".entry").addEventListener("click", (e) => { if (!e.target.closest("button")) st.input.focus(); });
      idle(st);
    });
    let active = -1, typingToken = 0;

    const question = (st) => t(st.key).replace("{name}", sender.value.trim());

    async function typeQuestion(st) {
      const token = ++typingToken, chars = Array.from(question(st));
      st.typed = true;
      for (let i = 1; i <= chars.length; i++) {
        if (token !== typingToken) return;
        st.qt.textContent = chars.slice(0, i).join("");
        if (!reduced && chars[i - 1] !== " ") Sound.key(0.35);
        if (!reduced) await new Promise(r => setTimeout(r, 22 + Math.random() * 22));
      }
    }

    const prog = document.getElementById("prog");

    // one question on screen at a time: the old one slides away, the new one takes its place
    function swap(from, to) {
      const back = to < from;
      if (from >= 0 && from !== to) {
        const out = steps[from].el;
        out.classList.remove("active", "entering", "rev");
        out.classList.add("leaving");
        out.classList.toggle("rev", back);
        setTimeout(() => { out.classList.remove("leaving", "rev"); if (active !== from) out.hidden = true; }, reduced ? 0 : 300);
      }
      steps.forEach((st, k) => { if (k !== to && !st.el.classList.contains("leaving")) st.el.hidden = true; });
      const inn = steps[to].el;
      inn.hidden = false;
      inn.classList.add("active");
      if (from >= 0 && from !== to && !reduced) {
        inn.classList.remove("entering", "rev"); void inn.offsetWidth;
        inn.classList.add("entering"); inn.classList.toggle("rev", back);
        setTimeout(() => inn.classList.remove("entering", "rev"), 360);
      }
      prog.textContent = (to + 1) + "/" + steps.length;
    }

    function show(i, { focus = true } = {}) {
      const from = active;
      active = i;
      clearErr();
      swap(from, i);
      const st = steps[i];
      if (!st.typed) typeQuestion(st); else st.qt.textContent = question(st);
      steps.forEach(idle);
      if (st.input && focus) st.input.focus({ preventScroll: true });     // same tap → keyboard stays open
      if (st.last && document.activeElement && document.activeElement.blur) document.activeElement.blur();
      if (focus) setTimeout(() => st.el.scrollIntoView({ block: "nearest", behavior: reduced ? "auto" : "smooth" }), 60);
    }

    function next() {
      const st = steps[active];
      if (!st || st.last) return;
      if (st.need && !st.input.value.trim()) return showErr(st.need, st.input);
      Sound.key();
      show(active + 1);
    }
    function back() {
      if (active <= 0) return;
      Sound.key(0.6);
      show(active - 1);
    }

    steps.forEach((st, j) => {
      st.el.querySelectorAll(".go").forEach(b => b.addEventListener("click", next));
      st.el.querySelectorAll(".back").forEach(b => b.addEventListener("click", back));
      if (st.input) st.input.addEventListener("keydown", (e) => {
        if (e.key !== "Enter" || e.isComposing || e.keyCode === 229) return;   // let IME (CJK) typing finish
        if (st.input === msg && e.shiftKey) return;                            // shift+enter = new line
        e.preventDefault();
        next();
      });
    });
    document.getElementById("skip").addEventListener("click", () => { contact.value = ""; next(); });

    return {
      begin() { if (active < 0) show(0, { focus: false }); },
      relabel() { typingToken++; steps.forEach(st => { if (st.typed) st.qt.textContent = question(st); }); },
      goTo(i) { show(i); },
      again() {                                   // keep name, contact and look; ask for a new message
        msg.value = ""; countEl.textContent = "0/1000"; grow();
        steps[1].typed = false;
        show(1);
      }
    };
  })();
  sel.addEventListener("change", () => Term.relabel());

  /* ───────── Character creator ───────── */
  const look = (() => {
    const saved = Av.parse(store.get("g14-look"));
    return saved || [Math.floor(Math.random() * Av.nH), Math.floor(Math.random() * Av.nO), Math.floor(Math.random() * Av.SKINS.length)];
  })();
  const lookCode = () => look.join("-");
  const preview = document.getElementById("preview"), pg = preview.getContext("2d");
  const skinsEl = document.getElementById("skins");
  Av.SKINS.forEach((c, i) => {
    const b = Object.assign(document.createElement("button"), { type: "button", className: "sk" });
    b.style.background = c; b.setAttribute("aria-label", "Skin " + (i + 1));
    b.addEventListener("click", () => { look[2] = i; Sound.key(); renderLook(); });
    skinsEl.appendChild(b);
  });
  let previewStep = 0;
  function drawPreview() {
    const f = Av.frames(lookCode());
    pg.clearRect(0, 0, 12, 16);
    pg.drawImage(f[previewStep], 0, 0);
  }
  function renderLook() {
    const hName = Av.headName(look[0]), fName = Av.outfitName(look[1]);
    document.getElementById("lblHead").textContent = `head ${look[0] + 1}/${Av.nH}${hName ? " · " + hName : ""}`;
    document.getElementById("lblFit").textContent = `outfit ${look[1] + 1}/${Av.nO}${fName ? " · " + fName : ""}`;
    [...skinsEl.children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === look[2])));
    store.set("g14-look", lookCode());
    drawPreview();
  }
  document.querySelectorAll(".arw").forEach(b => b.addEventListener("click", () => {
    const k = +b.dataset.k, n = k === 0 ? Av.nH : Av.nO;
    look[k] = (look[k] + +b.dataset.d + n) % n;
    Sound.key(); renderLook();
  }));
  document.getElementById("dice").addEventListener("click", () => {
    look[0] = Math.floor(Math.random() * Av.nH);
    look[1] = Math.floor(Math.random() * Av.nO);
    look[2] = Math.floor(Math.random() * Av.SKINS.length);
    Sound.snap(); renderLook();
  });
  renderLook();
  if (!reduced) setInterval(() => { previewStep ^= 1; drawPreview(); }, 380);

  /* ───────── Rate limit (per visitor, stored on their device) ───────── */
  const againBtn = document.getElementById("again");
  const waitEl = document.getElementById("wait");
  function sentLog() {
    let log = [];
    try { log = JSON.parse(store.get("g14-sent") || "[]"); } catch {}
    const dayAgo = Date.now() - 864e5;
    return Array.isArray(log) ? log.filter(ts => typeof ts === "number" && ts > dayAgo) : [];
  }
  function logSend() { const log = sentLog(); log.push(Date.now()); store.set("g14-sent", JSON.stringify(log)); }
  function limit() {
    const log = sentLog();
    if (!log.length) return null;
    if (log.length >= MAX_PER_DAY) return { kind: "daily", until: Math.min(...log) + 864e5 };
    const until = Math.max(...log) + COOLDOWN_MIN * 6e4;
    return until > Date.now() ? { kind: "cooldown", until } : null;
  }
  const fmt = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  let serverBlock = null;                    // "full" or "closed", reported by your Google Sheet
  let sending = false;
  function tick() {
    if (serverBlock) {
      form.hidden = true; done.hidden = true;
      waitEl.hidden = false; waitEl.textContent = t(serverBlock);
      return;
    }
    const l = limit();
    sendBtn.disabled = !!l || sending;
    againBtn.disabled = !!l;
    if (!l) { waitEl.hidden = true; return; }
    waitEl.hidden = false;
    if (l.kind === "daily") waitEl.textContent = t("daily");
    else {
      const [a, b] = t("cooldown").split("{t}");
      waitEl.replaceChildren(a, Object.assign(document.createElement("b"), { textContent: fmt(l.until - Date.now()) }), b || "");
    }
  }
  setInterval(tick, 1000);
  sel.addEventListener("change", tick);
  tick();

  // ask the sheet up front whether today's cap is used up, so nobody types into a closed inbox
  fetch(SCRIPT_URL).then(r => r.json()).then(d => {
    if (d && d.ok && d.open === false) { serverBlock = "full"; tick(); }
    if (d && Array.isArray(d.avatars)) Town.setVisitors(d.avatars);
  }).catch(() => {});

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearErr();
    const text = msg.value.trim(), who = sender.value.trim(), reach = contact.value.trim();
    if (!who) { Term.goTo(0); return showErr("noname", sender); }
    if (!text) { Term.goTo(1); return showErr("empty", msg); }
    if (form.botcheck.checked) return;
    if (limit()) { tick(); Sound.error(); return; }

    sending = true;
    sendBtn.disabled = true;
    sendLabel.dataset.i18n = "sending"; sendLabel.textContent = t("sending");
    Sound.transmit();
    const payload = { name: who, contact: reach, message: text, language: lang, avatar: lookCode(), botcheck: false };
    try {
      // text/plain keeps this a "simple" request, which Google's servers accept from any site
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.ok) {
        if (data.reason === "name") { Term.goTo(0); return showErr("badname", sender); }
        if (data.reason === "cap" || data.reason === "closed") {
          serverBlock = data.reason === "cap" ? "full" : "closed";
          Sound.error();
          return;
        }
        throw new Error(data.reason);
      }
      form.hidden = true; done.hidden = false;
      logSend();
      Sound.success();
      Town.addMe({ n: who, a: lookCode(), t: Date.now() });
    } catch {
      showErr("error");
    } finally {
      sending = false;
      sendLabel.dataset.i18n = "send"; sendLabel.textContent = t("send");
      tick();
    }
  });

  againBtn.addEventListener("click", () => {
    done.hidden = true; form.hidden = false;
    Term.again();
  });
</script>
</body>
</html>
