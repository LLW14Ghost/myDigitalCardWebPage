<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Ghost14</title>

<meta property="og:description" content="Leave me a message.">

<style>
  :root {
    --bg: #000;
    --panel: rgba(4, 5, 4, .78);
    --line: rgba(236, 232, 223, .12);
    --text: #ece8df;
    --muted: #9b968c;
    --dim: #5f5b54;
    --spore: #9fe0a8;
    --warn: #f0a39a;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas,
            "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", "Noto Sans", system-ui, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    color: var(--text);
    font: 14px/1.6 var(--mono);
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* ── background ── */
  #life {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none;
    opacity: 0; transition: opacity 2.2s ease;
  }
  #life.on { opacity: 1; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(70% 55% at 50% 50%, rgba(0,0,0,.82), rgba(0,0,0,.3) 70%, rgba(0,0,0,.1));
  }

  /* ── layout ── */
  .stage {
    position: relative; z-index: 1;
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px;
    padding: max(60px, env(safe-area-inset-top)) 16px max(52px, env(safe-area-inset-bottom));
    pointer-events: none;
  }
  .stage > * { pointer-events: auto; }
  .later { display: none !important; }
  .ghosted { opacity: 0; pointer-events: none; }

  /* ── name ── */
  .name {
    display: flex; align-items: center; gap: .28em;
    font-weight: 800;
    font-size: clamp(46px, 15vw, 76px);
    line-height: 1;
    letter-spacing: -.04em;
    white-space: nowrap;
    will-change: transform;
  }
  .name .tri { color: var(--spore); font-size: .5em; letter-spacing: 0; }
  .name .typed { display: inline-flex; align-items: flex-start; }
  .tag {
    font: 500 .22em/1 var(--mono);
    letter-spacing: .05em;
    color: var(--spore);
    border: 1px solid rgba(159,224,168,.4);
    padding: .35em .45em;
    margin: .12em 0 0 .3em;
    animation: snap .5s ease-out;
  }
  @keyframes snap {
    0% { box-shadow: 0 0 0 0 rgba(159,224,168,.6); background: rgba(159,224,168,.25); }
    100% { box-shadow: 0 0 0 10px rgba(159,224,168,0); background: transparent; }
  }

  .cursor {
    display: inline-block; width: .55em; height: 1em;
    background: var(--spore); margin-left: .12em;
    animation: blink 1s steps(1) infinite;
  }
  .name .cursor { height: .82em; width: .45em; }

  /* ── prompt line ── */
  .ask {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; color: var(--muted); min-height: 1.6em;
  }
  .ask .tri { color: var(--spore); font-size: 11px; }

  /* ── message box ── */
  .box {
    width: 100%; max-width: 420px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    padding: 14px 14px 12px;
    transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1);
  }
  .box.ghosted { transform: translateY(14px); }
  .comment { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .field { display: flex; gap: 8px; align-items: flex-start; }
  .field + .field { margin-top: 8px; }
  .field .p, .field .flag { flex: none; width: 62px; white-space: nowrap; }
  .field .p { color: var(--spore); padding-top: 7px; }
  .field .flag { color: var(--dim); padding-top: 9px; font-size: 12px; }
  .field .flag.req::after { content: "*"; color: var(--spore); margin-left: 2px; }
  textarea, input[type=text] {
    flex: 1; min-width: 0;
    background: rgba(255,255,255,.025);
    border: 1px solid var(--line); border-radius: 0;
    color: var(--text); caret-color: var(--spore);
    font: 16px/1.5 var(--mono); /* 16px stops iOS zoom */
    padding: 6px 9px;
    -webkit-appearance: none; appearance: none;
    transition: border-color .2s;
  }
  textarea { min-height: 104px; resize: none; overflow: hidden; }
  ::placeholder { color: var(--dim); }
  textarea:focus, input:focus { outline: none; border-color: rgba(159,224,168,.5); }
  .bad { border-color: rgba(240,163,154,.6) !important; }

  .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; }
  .count { color: var(--dim); font-size: 12px; }
  .btn {
    background: none; border: 0; padding: 6px 0; cursor: pointer;
    font: 500 14px var(--mono); color: var(--spore);
    -webkit-tap-highlight-color: transparent;
  }
  .btn .k { color: var(--dim); }
  .btn:hover .label, .btn:focus-visible .label { background: var(--spore); color: #000; }
  .btn:focus { outline: none; }
  .btn:disabled { opacity: .5; cursor: wait; }
  .hp { position: absolute; left: -9999px; }
  .err { color: var(--warn); font-size: 12px; margin-top: 8px; }
  .done { padding: 12px 2px 4px; }
  .done .ok { color: var(--spore); }
  .done .btn { margin-top: 14px; }
  .wait { color: var(--dim); font-size: 12px; margin-top: 10px; }
  .wait b { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }

  /* ── corners ── */
  .corner { position: fixed; z-index: 2; transition: opacity 1s ease; }
  .top { top: max(14px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 8px; }
  .top.left { left: 14px; }
  .top.right { right: 14px; }
  .gh {
    font-size: 11px; color: var(--muted); text-decoration: none;
    border: 1px solid var(--line); background: rgba(0,0,0,.6);
    padding: 4px 8px; letter-spacing: .02em;
  }
  .gh .arr { color: var(--spore); }
  .gh:hover, .gh:focus-visible { color: var(--text); border-color: rgba(159,224,168,.5); outline: none; }
  .lang { position: relative; display: flex; align-items: center; }
  .lang select {
    appearance: none; -webkit-appearance: none;
    background: rgba(0,0,0,.6); border: 1px solid var(--line); border-radius: 0;
    color: var(--muted); font: 11px var(--mono);
    padding: 4px 20px 4px 8px; cursor: pointer;
  }
  .lang::after { content: "▾"; position: absolute; right: 7px; pointer-events: none; font-size: 9px; color: var(--muted); }
  .lang select:focus { outline: none; border-color: rgba(159,224,168,.5); }
  .lang option { background: #000; color: var(--text); }
  .snd {
    display: grid; place-items: center;
    width: 27px; height: 25px; padding: 0;
    background: rgba(0,0,0,.6); border: 1px solid var(--line); border-radius: 0;
    color: var(--muted); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .snd:hover, .snd:focus-visible { color: var(--text); border-color: rgba(159,224,168,.5); outline: none; }
  .snd[aria-pressed="true"] { color: var(--spore); }
  .snd .w { transition: opacity .2s; }
  .snd[aria-pressed="false"] .w { opacity: 0; }
  .snd[aria-pressed="true"] .x { opacity: 0; }
  .hint {
    bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0;
    text-align: center; font-size: 11px; color: var(--dim); pointer-events: none;
  }

  @keyframes blink { 50% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="life" aria-hidden="true"></canvas>
<div class="vignette"></div>

<div class="corner top left ghosted" id="topLeft">
  <a class="gh" id="gh" href="#" target="_blank" rel="noopener me" hidden><span class="arr">↗</span> github</a>
</div>
<div class="corner top right ghosted" id="topRight">
  <button type="button" class="snd" id="snd" aria-label="Sound" aria-pressed="false">
    <svg width="15" height="13" viewBox="0 0 15 13" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
      <path d="M1 4.5h2.5L7 1.5v10L3.5 8.5H1z" fill="currentColor" stroke="none"/>
      <path class="w" d="M9.5 4.2a3 3 0 0 1 0 4.6M11.5 2.4a5.6 5.6 0 0 1 0 8.2"/>
      <path class="x" d="M9.5 4.5l4 4M13.5 4.5l-4 4"/>
    </svg>
  </button>
  <label class="lang"><select id="lang" aria-label="Language"></select></label>
</div>

<main class="stage">
  <h1 class="name" id="nameLine" aria-label="Ghost14">
    <span class="tri" aria-hidden="true">▸</span>
    <span class="typed" id="typed" aria-hidden="true"></span>
  </h1>

  <p class="ask later" id="askLine">
    <span class="tri" aria-hidden="true">▸</span>
    <span id="askText" dir="auto">&nbsp;</span>
  </p>

  <section class="box later" id="box">
    <form id="msg-form" novalidate>
      <p class="comment" dir="auto"># <span data-i18n="hint"></span></p>
      <div class="field">
        <span class="p">&gt;</span>
        <textarea id="message" name="message" maxlength="1000" dir="auto" data-i18n-ph="msg_ph" required></textarea>
      </div>
      <div class="field">
        <label class="flag req" for="sender">--name</label>
        <input type="text" id="sender" name="sender" maxlength="60" dir="auto" data-i18n-ph="name_ph" autocomplete="nickname" required>
      </div>
      <div class="field">
        <label class="flag" for="contact">--reply</label>
        <input type="text" id="contact" name="contact" maxlength="120" dir="auto" data-i18n-ph="contact_ph" autocomplete="off">
      </div>
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">
      <p class="err" id="err" dir="auto" hidden></p>
      <div class="actions">
        <span class="count" id="count">0/1000</span>
        <button type="submit" class="btn" id="send"><span class="k">[</span> <span class="label" id="sendLabel" data-i18n="send"></span> ↵ <span class="k">]</span></button>
      </div>
    </form>
    <div class="done" id="done" hidden>
      <p class="ok" dir="auto" data-i18n="sent"></p>
      <button type="button" class="btn" id="again"><span class="k">[</span> <span class="label" data-i18n="again"></span> <span class="k">]</span></button>
    </div>
    <p class="wait" id="wait" dir="auto" aria-live="polite" hidden></p>
  </section>
</main>

      g.gain.setValueAtTime(0.0001, t);

      },
      snap() {                               // "14" locking into its box
        if (!live()) return;
        const t = ctx.currentTime;
        blip(1318.5, "square", t, 0.05, 0.035);
        blip(1975.5, "square", t + 0.045, 0.04, 0.025);

        o.frequency.setValueAtTime(720, t);

  /* ───────── Game of Life ───────── */
  const life = (() => {
    const canvas = document.getElementById("life");
    const ctx = canvas.getContext("2d");
    const CELL = 9, STEP_MS = 140;
    let cols, rows, grid, next, age, last = 0, quiet = 0, running = false, gen = 0;

    function resize() {

      grid = new Uint8Array(cols * rows); next = new Uint8Array(cols * rows); age = new Float32Array(cols * rows);
      seed(0.16);
    }
    function seed(p) { for (let i = 0; i < grid.length; i++) if (Math.random() < p) { grid[i] = 1; age[i] = 0; } }
    function burst(cx, cy) {
      const c = Math.floor(cx / CELL), r = Math.floor(cy / CELL);
      for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) if (Math.random() < .5) {
        const i = ((r + dy + rows) % rows) * cols + (c + dx + cols) % cols; grid[i] = 1; age[i] = 0;
      }
      draw();
    }
    function step() {
      let alive = 0, changed = 0, births = 0, pick = -1;
      for (let y = 0; y < rows; y++) {
        const up = ((y - 1 + rows) % rows) * cols, mid = y * cols, dn = ((y + 1) % rows) * cols;
        for (let x = 0; x < cols; x++) {
          const l = (x - 1 + cols) % cols, r = (x + 1) % cols;
          const n = grid[up+l] + grid[up+x] + grid[up+r] + grid[mid+l] + grid[mid+r] + grid[dn+l] + grid[dn+x] + grid[dn+r];
          const i = mid + x, live = grid[i], v = (n === 3 || (live && n === 2)) ? 1 : 0;
          next[i] = v;
          if (v) { alive++; age[i] = live ? age[i] + 1 : 0; }
          if (v && !live && Math.random() * ++births < 1) pick = i;   // random birth for the music
          if (v !== live) changed++;
        }
      }
      [grid, next] = [next, grid];
      quiet = changed < grid.length * 0.004 ? quiet + 1 : 0;
      if (alive < grid.length * 0.02 || quiet > 25) { seed(0.06); quiet = 0; }

        ctx.fillRect((i % cols) * CELL + 1, Math.floor(i / cols) * CELL + 1, CELL - 2, CELL - 2);
      }
    }

        const { births, pick } = step(); draw(); last = ts;
        if (++gen % 3 === 0 && pick >= 0 && Math.random() < Math.min(1, births / 30)) {

    }

        canvas.classList.add("on");

      }
    };

    box.classList.remove("ghosted");
    ["topLeft", "topRight", "hint"].forEach(id => document.getElementById(id).classList.remove("ghosted"));
    life.start(!reduced);
  }

  async function intro() {
    await typeName();
    await wait(650);
    await moveUp();
    await wait(150);
    await typeAsk();
    await wait(350);
    reveal();
  }

  const skip = () => { skipping = true; };
  addEventListener("pointerdown", skip, { once: true });
  addEventListener("keydown", skip, { once: true });

  applyLang();
  intro();

  /* ───────── Message form ───────── */
  const form = document.getElementById("msg-form");
  const done = document.getElementById("done");
  const msg = document.getElementById("message");
  const sender = document.getElementById("sender");
  const contact = document.getElementById("contact");
  const countEl = document.getElementById("count");
  const sendBtn = document.getElementById("send");
  const sendLabel = document.getElementById("sendLabel");
  const errEl = document.getElementById("err");

  function grow() { msg.style.height = "auto"; msg.style.height = Math.max(104, msg.scrollHeight + 2) + "px"; }
  function showErr(key, field) {
    errEl.textContent = t(key); errEl.hidden = false;
    if (field) { field.classList.add("bad"); field.focus(); }
    Sound.error();
  }
  function clearErr() { errEl.hidden = true; [msg, sender].forEach(f => f.classList.remove("bad")); }
  msg.addEventListener("input", () => { countEl.textContent = msg.value.length + "/1000"; grow(); clearErr(); });
  sender.addEventListener("input", clearErr);
  msg.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) form.requestSubmit(); });

  /* ───────── Rate limit (per visitor, stored on their device) ───────── */
  const againBtn = document.getElementById("again");
  const waitEl = document.getElementById("wait");
  function sentLog() {
    let log = [];
    try { log = JSON.parse(store.get("g14-sent") || "[]"); } catch {}
    const dayAgo = Date.now() - 864e5;
    return Array.isArray(log) ? log.filter(ts => typeof ts === "number" && ts > dayAgo) : [];
  }
  function logSend() { const log = sentLog(); log.push(Date.now()); store.set("g14-sent", JSON.stringify(log)); }
  function limit() {
    const log = sentLog();
    if (!log.length) return null;
    if (log.length >= MAX_PER_DAY) return { kind: "daily", until: Math.min(...log) + 864e5 };
    const until = Math.max(...log) + COOLDOWN_MIN * 6e4;
    return until > Date.now() ? { kind: "cooldown", until } : null;
  }
  const fmt = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  let serverBlock = null;                    // "full" or "closed", reported by your Google Sheet
  function tick() {
    if (serverBlock) {
      sendBtn.disabled = againBtn.disabled = true;
      waitEl.hidden = false; waitEl.textContent = t(serverBlock);
      return;
    }
    const l = limit();
    sendBtn.disabled = againBtn.disabled = !!l;
    if (!l) { waitEl.hidden = true; return; }
    waitEl.hidden = false;
    if (l.kind === "daily") waitEl.textContent = t("daily");
    else {
      const [a, b] = t("cooldown").split("{t}");
      waitEl.replaceChildren(a, Object.assign(document.createElement("b"), { textContent: fmt(l.until - Date.now()) }), b || "");
    }
  }
  setInterval(tick, 1000);
  sel.addEventListener("change", tick);
  tick();

  // ask the sheet up front whether today's cap is used up, so nobody types into a closed inbox
  fetch(SCRIPT_URL).then(r => r.json()).then(d => {
    if (d && d.ok && d.open === false) { serverBlock = "full"; tick(); }
  }).catch(() => {});

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearErr();
    const text = msg.value.trim(), who = sender.value.trim(), reach = contact.value.trim();
    if (!text) return showErr("empty", msg);
    if (!who) return showErr("noname", sender);
    if (form.botcheck.checked) return;
    if (limit()) { tick(); Sound.error(); return; }

    sendBtn.disabled = true;
    sendLabel.dataset.i18n = "sending"; sendLabel.textContent = t("sending");
    Sound.transmit();
    const payload = { name: who, contact: reach, message: text, language: lang, botcheck: false };
    try {
      // text/plain keeps this a "simple" request, which Google's servers accept from any site
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.ok) {
        if (data.reason === "cap" || data.reason === "closed") {
          serverBlock = data.reason === "cap" ? "full" : "closed";
          Sound.error();
          return;
        }
        throw new Error(data.reason);
      }
      form.reset(); countEl.textContent = "0/1000"; grow();
      box.style.minHeight = box.offsetHeight + "px";   // keep the layout from jumping
      form.hidden = true; done.hidden = false;
      logSend();
      Sound.success();
    } catch {
      showErr("error");
    } finally {
      sendLabel.dataset.i18n = "send"; sendLabel.textContent = t("send");
      tick();
    }
  });

  againBtn.addEventListener("click", () => {
    done.hidden = true; form.hidden = false; box.style.minHeight = ""; msg.focus();
  });
</script>
</body>
</html>
